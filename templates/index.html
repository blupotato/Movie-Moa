<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>무비모아 | 오늘의 영화</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="무비모아 홈"><span class="brand-icon">M</span><span>movie<span class="brand-light">moa</span></span></a>
    <nav class="tabs" aria-label="메인 메뉴"><button class="tab active" data-view="boxoffice">박스오피스</button><button class="tab" data-view="diary">내 영화 기록 <span id="diary-count" class="count" hidden>0</span></button></nav>
  </header>
  <main id="home">
    <section class="hero" aria-label="무비모아">
      <div class="hero-mark"><span class="hero-mark-icon">M</span><span>무비모아</span></div>
    </section>
    <section id="boxoffice-view" class="content-section">
      <div class="section-heading"><div><h2>오늘의 박스오피스</h2></div><label class="date-control"><span>기준 날짜</span><input id="date-picker" type="date" aria-label="박스오피스 기준 날짜"></label></div>
      <div id="status" class="status" role="status"><span class="spinner"></span>영화 정보를 불러오는 중이에요</div>
      <div id="movie-grid" class="movie-grid"></div>
    </section>
    <section id="diary-view" class="content-section hidden">
      <div class="section-heading"><div><h2>나의 영화 기록</h2></div></div>
      <div id="diary-stats" class="stats-grid"></div><div id="diary-list" class="diary-list"></div>
    </section>
    <footer class="footer"><span>영화 데이터 제공 <a href="https://www.kobis.or.kr/" target="_blank" rel="noreferrer">KOBIS</a> · 포스터 및 정보 제공 <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">TMDB</a></span></footer>
  </main>
  <dialog id="movie-dialog" class="movie-dialog"><button class="dialog-close" aria-label="닫기">×</button><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
